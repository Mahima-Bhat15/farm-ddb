# Region-aware TCP load balancer in front of the CockroachDB nodes.
# Each region's port sends traffic to that region's 3 nodes; the other
# regions' nodes are "backup" servers used only if all local nodes fail.
# Health check: CockroachDB's HTTP endpoint /health?ready=1 on port 8080.

global
    maxconn 4096

defaults
    mode tcp
    timeout connect 3s
    timeout client 10m
    timeout server 10m
    option tcplog
    default-server inter 1s fall 2 rise 2 check port 8080
    option httpchk GET /health?ready=1

listen us-west
    bind :26001
    balance roundrobin
    server roach1 roach1:26257
    server roach2 roach2:26257
    server roach3 roach3:26257
    server roach4 roach4:26257 backup
    server roach7 roach7:26257 backup

listen us-east
    bind :26002
    balance roundrobin
    server roach4 roach4:26257
    server roach5 roach5:26257
    server roach6 roach6:26257
    server roach1 roach1:26257 backup
    server roach7 roach7:26257 backup

listen eu-west
    bind :26003
    balance roundrobin
    server roach7 roach7:26257
    server roach8 roach8:26257
    server roach9 roach9:26257
    server roach1 roach1:26257 backup
    server roach4 roach4:26257 backup

listen stats
    bind :8404
    mode http
    stats enable
    stats uri /
    stats refresh 2s
